name: Auto close PRs

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close PR with message
        uses: peter-evans/close-pull@v3
        with:
          comment: |
            Grazie per l'interesse! Al momento non accettiamo contributi via Pull Request.
            Ti invitiamo a condividere idee e suggerimenti in Discussions: https://github.com/Pioshin/writers-nexus/discussions
          delete-branch: false
