<div
  id="confirm-modal"
  class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 hidden"
>
  <div
    class="bg-secondary rounded-lg shadow-xl w-full max-w-md p-6 border border-accent/30"
  >
    <div class="flex justify-between items-center mb-4">
      <h3 id="confirm-modal-title" class="text-xl font-bold text-primary">
        Conferma
      </h3>
      <button
        id="confirm-modal-close-btn"
        class="text-secondary hover:accent"
        aria-label="Chiudi"
      >
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
    </div>
    <div id="confirm-modal-body">
      <p id="confirm-modal-message" class="text-secondary mb-6">Sei sicuro?</p>
      <div class="flex justify-end gap-3">
        <button id="confirm-secondary-btn" class="btn btn-secondary">
          Annulla
        </button>
        <button id="confirm-primary-btn" class="btn btn-primary">
          Conferma
        </button>
      </div>
    </div>
  </div>
</div>
