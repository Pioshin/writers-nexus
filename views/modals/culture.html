<div id="culture-modal" class="modal-backdrop hidden">
    <div class="bg-secondary w-full max-w-2xl rounded-2xl p-8 border border-accent/20 flex flex-col">
        <h3 class="text-2xl font-display mb-4">Crea / Modifica Elemento Culturale</h3>
        <div class="flex gap-2 mb-3">
            <button type="button" id="cult-tab-details" class="px-3 py-1 rounded-lg bg-accent/20 text-accent font-semibold">Dettagli</button>
            <button type="button" id="cult-tab-ai" class="px-3 py-1 rounded-lg hover:bg-primary">IA</button>
        </div>
        <form id="culture-form" class="flex-grow overflow-y-auto pr-4 space-y-3">
            <div id="cult-tab-details-pane" class="space-y-3">
            <input type="hidden" name="id" id="culture-id">
            <input id="cult-name" name="name" type="text" placeholder="Nome (es: Ordine dei Guardiani)" required class="w-full mb-2 px-4 py-2 bg-primary border border-accent/30 rounded-lg">
            <textarea id="cult-details" name="details" placeholder="Dettagli su società, tradizioni, religioni, politica..." rows="6" class="w-full mb-2 p-3 bg-primary rounded-lg border border-accent/30"></textarea>
            </div>
            <div id="cult-tab-ai-pane" class="hidden space-y-3">
                <div class="rounded-lg border border-accent/20 p-4 bg-primary/40 space-y-3">
                    <p class="text-sm text-secondary">Usa l'IA per creare o migliorare l'elemento culturale. Risposta in JSON.</p>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-start">
                        <div class="md:col-span-2">
                            <label class="text-xs font-semibold text-secondary">Istruzioni IA</label>
                            <textarea id="ai-cult-instructions" rows="5" class="w-full mt-1 p-3 bg-primary rounded-lg border border-accent/30" placeholder="Es. Struttura gerarchia, rituali, valori, conflitti..."></textarea>
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-semibold text-secondary">Parametri</label>
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-secondary">Temp</span>
                                <input id="ai-cult-temp" type="range" min="0" max="1" step="0.1" value="0.7" class="w-full">
                                <span id="ai-cult-temp-val" class="text-xs w-6 text-right">0.7</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-secondary">MaxTok</span>
                                <input id="ai-cult-maxtok" type="number" min="200" max="2000" step="100" value="600" class="w-24 px-2 py-1 bg-primary border border-accent/30 rounded-lg">
                            </div>
                            <label class="flex items-center gap-2 text-xs">
                                <input id="ai-cult-use-context" type="checkbox" checked class="accent-accent">
                                <span>Usa contesto romanzo</span>
                            </label>
                            <div id="ai-cult-context-status" class="text-[11px] text-secondary"></div>
                            <div class="grid grid-cols-2 gap-2 pt-1">
                                <div>
                                    <label class="text-xs text-secondary">Genere</label>
                                    <input id="ai-cult-genre" type="text" class="w-full px-2 py-1 bg-primary border border-accent/30 rounded-lg">
                                </div>
                                <div>
                                    <label class="text-xs text-secondary">Tono</label>
                                    <input id="ai-cult-tone" type="text" class="w-full px-2 py-1 bg-primary border border-accent/30 rounded-lg">
                                </div>
                            </div>
                            <div class="flex gap-2 pt-1">
                                <button type="button" id="ai-cult-generate" class="px-3 py-2 text-sm bg-accent text-primary font-bold rounded-lg hover:bg-accent-hover">Crea</button>
                                <button type="button" id="ai-cult-improve" class="px-3 py-2 text-sm bg-accent/20 text-accent font-semibold rounded-lg hover:bg-accent/30">Migliora</button>
                                <button type="button" id="ai-cult-stop" class="px-3 py-2 text-sm bg-red-500/20 text-red-500 font-semibold rounded-lg hover:bg-red-500/30">Stop</button>
                            </div>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-secondary">Risultato (JSON)</label>
                        <pre id="ai-cult-output" class="w-full bg-primary rounded-lg border border-accent/30 p-3 overflow-auto" style="max-height: 220px;"></pre>
                        <div class="flex gap-2">
                            <button type="button" id="ai-cult-apply" class="px-3 py-2 text-sm bg-accent/20 text-accent font-semibold rounded-lg hover:bg-accent/30">Applica ai campi</button>
                            <button type="button" id="ai-cult-copy" class="px-3 py-2 text-sm bg-primary border border-accent/30 rounded-lg">Copia</button>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="flex justify-end gap-4 mt-6 pt-4 border-t border-accent/20">
            <button type="button" id="cancel-culture-modal" class="px-6 py-2 bg-primary rounded-lg hover:bg-opacity-80">Annulla</button>
            <button type="button" id="save-culture-btn" class="px-6 py-2 bg-accent text-primary font-bold rounded-lg hover:bg-accent-hover">Salva Elemento</button>
        </div>
    </div>
</div>
