<div id="character-modal" class="modal-backdrop hidden">
    <div class="bg-secondary w-full max-w-4xl h-[90vh] rounded-2xl p-8 border border-accent/20 flex flex-col">
        <h3 class="text-2xl font-display mb-4">Crea / Modifica Personaggio</h3>
        <form id="character-form" class="flex-grow overflow-y-auto pr-4 grid grid-cols-1 md:grid-cols-2 gap-x-6">
            <input type="hidden" name="id" id="character-id">
            <div>
                <h4 class="font-display text-lg accent mt-4 mb-2">Dati e Contesto</h4>
                <input id="char-name" name="name" type="text" placeholder="Nome completo" required class="w-full mb-2 px-4 py-2 bg-primary border border-accent/30 rounded-lg">
                <textarea id="char-context" name="context" placeholder="Contesto Sociale e Culturale (famiglia, classe, istruzione...)" rows="3" class="w-full mb-2 p-3 bg-primary rounded-lg border border-accent/30"></textarea>
                <h4 class="font-display text-lg accent mt-4 mb-2">Psicologia Profonda</h4>
                <textarea id="char-psychology" name="psychology" placeholder="Desideri, paure, bisogno interiore, valori, contraddizioni..." rows="5" class="w-full mb-2 p-3 bg-primary rounded-lg border border-accent/30"></textarea>
                <textarea id="char-past" name="past" placeholder="Passato significativo (traumi, successi, eventi chiave...)" rows="4" class="w-full mb-2 p-3 bg-primary rounded-lg border border-accent/30"></textarea>
            </div>
            <div>
                <h4 class="font-display text-lg accent mt-4 mb-2">Aspetto e Comportamento</h4>
                <textarea id="char-appearance" name="appearance" placeholder="Fisicità, linguaggio del corpo, stile, segni distintivi..." rows="4" class="w-full mb-2 p-3 bg-primary rounded-lg border border-accent/30"></textarea>
                <h4 class="font-display text-lg accent mt-4 mb-2">Voce e Comunicazione</h4>
                <textarea id="char-voice" name="voice" placeholder="Tono, ritmo, registro linguistico, canale rappresentazionale (Visivo, Uditivo, Cinestesico)..." rows="4" class="w-full mb-2 p-3 bg-primary rounded-lg border border-accent/30"></textarea>
            </div>
        </form>
        <div class="flex justify-end gap-4 mt-6 pt-4 border-t border-accent/20">
            <button type="button" id="cancel-character-modal" class="px-6 py-2 bg-primary rounded-lg hover:bg-opacity-80">Annulla</button>
            <button type="button" id="save-character-btn" class="px-6 py-2 bg-accent text-primary font-bold rounded-lg hover:bg-accent-hover">Salva Personaggio</button>
        </div>
    </div>
</div>
