<div id="character-modal" class="modal-backdrop hidden">
  <div class="bg-secondary w-full max-w-3xl rounded-2xl p-8 border border-accent/20 flex flex-col"
    style="max-height: 90vh">
    <h3 id="character-modal-title" class="text-2xl font-display mb-4">
      Crea/Modifica Personaggio
    </h3>



    <form id="character-form" class="flex-grow overflow-y-auto pr-4 space-y-4">
      <div id="character-tab-details" class="space-y-4">
        <!-- Tip per AI -->
        <div class="flex items-center gap-2 p-3 bg-accent/10 rounded-lg border border-accent/20 text-sm">
          <i data-lucide="sparkles" class="w-4 h-4 text-accent"></i>
          <span class="text-secondary">Usa il pannello <strong class="text-accent">Nexus AI</strong> (✨ in basso a
            destra) per generare o migliorare questo personaggio.</span>
        </div>

        <input type="hidden" id="character-id" />
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="form-group">
            <label for="character-name" class="text-sm font-semibold text-secondary">Nome Personaggio</label>
            <input id="character-name" type="text" placeholder="Es: Kenla Quilah" required
              class="w-full mt-1 px-4 py-2 bg-primary border border-accent/30 rounded-lg" />
          </div>
          <div class="form-group">
            <label for="character-role" class="text-sm font-semibold text-secondary">Ruolo/Professione</label>
            <input id="character-role" type="text" placeholder="Es: Comandante"
              class="w-full mt-1 px-4 py-2 bg-primary border border-accent/30 rounded-lg" />
          </div>
        </div>

        <div class="form-group">
          <label for="character-appearance" class="text-sm font-semibold text-secondary">Aspetto</label>
          <textarea id="character-appearance" placeholder="Descrivi l'aspetto fisico del personaggio..." rows="3"
            class="w-full mt-1 p-3 bg-primary rounded-lg border border-accent/30"></textarea>
        </div>

        <div class="form-group">
          <label for="character-psychology" class="text-sm font-semibold text-secondary">Psicologia</label>
          <textarea id="character-psychology" placeholder="Descrivi la personalità, i valori, le paure..." rows="3"
            class="w-full mt-1 p-3 bg-primary rounded-lg border border-accent/30"></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="form-group">
            <label for="character-past" class="text-sm font-semibold text-secondary">Passato</label>
            <textarea id="character-past" placeholder="Eventi chiave del suo passato..." rows="3"
              class="w-full mt-1 p-3 bg-primary rounded-lg border border-accent/30"></textarea>
          </div>
          <div class="form-group">
            <label for="character-voice" class="text-sm font-semibold text-secondary">Voce e Linguaggio</label>
            <textarea id="character-voice" placeholder="Tono di voce, slang, frasi tipiche..." rows="3"
              class="w-full mt-1 p-3 bg-primary rounded-lg border border-accent/30"></textarea>
          </div>
        </div>

        <div class="form-group">
          <label class="text-sm font-semibold text-secondary">Tags Narrativi</label>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-2">
            <select id="character-archetype" class="flex-1 px-4 py-2 bg-primary border border-accent/30 rounded-lg">
              <option value="">Nessun Archetipo</option>
            </select>
            <select id="character-narrative-role"
              class="flex-1 px-4 py-2 bg-primary border border-accent/30 rounded-lg">
              <option value="">Nessun Ruolo Narrativo</option>
            </select>
            <select id="character-importance" class="flex-1 px-4 py-2 bg-primary border border-accent/30 rounded-lg">
              <option value="">Nessuna Importanza</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="text-sm font-semibold text-secondary">Relazioni</label>
          <div id="character-relations-editor" class="mt-2 space-y-2">
            <!-- Relationship rows will be added here by JS -->
          </div>
          <button type="button" id="add-relation-btn"
            class="mt-2 px-4 py-2 text-sm bg-accent/20 text-accent font-semibold rounded-lg hover:bg-accent/30">
            + Aggiungi Relazione
          </button>
        </div>
      </div>
    </form>


    <div class="flex justify-end gap-4 mt-6 pt-4 border-t border-accent/20 flex-shrink-0">
      <button type="button" id="cancel-character-btn" class="px-6 py-2 bg-primary rounded-lg hover:bg-opacity-80">
        Annulla
      </button>
      <button type="button" id="save-character-btn"
        class="px-6 py-2 bg-accent text-primary font-bold rounded-lg hover:bg-accent-hover">
        Salva Personaggio
      </button>
    </div>
  </div>
</div>
