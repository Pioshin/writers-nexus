<div id="character-modal" class="modal-backdrop hidden">
  <div
    class="bg-secondary w-full max-w-3xl rounded-2xl p-8 border border-accent/20 flex flex-col"
    style="max-height: 90vh"
  >
    <h3 id="character-modal-title" class="text-2xl font-display mb-4">
      Crea/Modifica Personaggio
    </h3>

    <!-- Tabs -->
    <div class="flex gap-2 mb-4">
      <button
        type="button"
        id="tab-details"
        class="px-3 py-1 rounded-lg bg-accent/20 text-accent font-semibold"
      >
        Dettagli
      </button>
      <button
        type="button"
        id="tab-ai"
        class="px-3 py-1 rounded-lg hover:bg-primary"
      >
        IA
      </button>
    </div>

    <form id="character-form" class="flex-grow overflow-y-auto pr-4 space-y-4">
      <div id="character-tab-details" class="space-y-4">
        <input type="hidden" id="character-id" />
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="form-group">
            <label
              for="character-name"
              class="text-sm font-semibold text-secondary"
              >Nome Personaggio</label
            >
            <input
              id="character-name"
              type="text"
              placeholder="Es: Kenla Quilah"
              required
              class="w-full mt-1 px-4 py-2 bg-primary border border-accent/30 rounded-lg"
            />
          </div>
          <div class="form-group">
            <label
              for="character-role"
              class="text-sm font-semibold text-secondary"
              >Ruolo/Professione</label
            >
            <input
              id="character-role"
              type="text"
              placeholder="Es: Comandante"
              class="w-full mt-1 px-4 py-2 bg-primary border border-accent/30 rounded-lg"
            />
          </div>
        </div>

        <div class="form-group">
          <label
            for="character-appearance"
            class="text-sm font-semibold text-secondary"
            >Aspetto</label
          >
          <textarea
            id="character-appearance"
            placeholder="Descrivi l'aspetto fisico del personaggio..."
            rows="3"
            class="w-full mt-1 p-3 bg-primary rounded-lg border border-accent/30"
          ></textarea>
        </div>

        <div class="form-group">
          <label
            for="character-psychology"
            class="text-sm font-semibold text-secondary"
            >Psicologia</label
          >
          <textarea
            id="character-psychology"
            placeholder="Descrivi la personalità, i valori, le paure..."
            rows="3"
            class="w-full mt-1 p-3 bg-primary rounded-lg border border-accent/30"
          ></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="form-group">
            <label
              for="character-past"
              class="text-sm font-semibold text-secondary"
              >Passato</label
            >
            <textarea
              id="character-past"
              placeholder="Eventi chiave del suo passato..."
              rows="3"
              class="w-full mt-1 p-3 bg-primary rounded-lg border border-accent/30"
            ></textarea>
          </div>
          <div class="form-group">
            <label
              for="character-voice"
              class="text-sm font-semibold text-secondary"
              >Voce e Linguaggio</label
            >
            <textarea
              id="character-voice"
              placeholder="Tono di voce, slang, frasi tipiche..."
              rows="3"
              class="w-full mt-1 p-3 bg-primary rounded-lg border border-accent/30"
            ></textarea>
          </div>
        </div>

        <div class="form-group">
          <label class="text-sm font-semibold text-secondary"
            >Tags Narrativi</label
          >
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-2">
            <select
              id="character-archetype"
              class="flex-1 px-4 py-2 bg-primary border border-accent/30 rounded-lg"
            >
              <option value="">Nessun Archetipo</option>
            </select>
            <select
              id="character-narrative-role"
              class="flex-1 px-4 py-2 bg-primary border border-accent/30 rounded-lg"
            >
              <option value="">Nessun Ruolo Narrativo</option>
            </select>
            <select
              id="character-importance"
              class="flex-1 px-4 py-2 bg-primary border border-accent/30 rounded-lg"
            >
              <option value="">Nessuna Importanza</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="text-sm font-semibold text-secondary">Relazioni</label>
          <div id="character-relations-editor" class="mt-2 space-y-2">
            <!-- Relationship rows will be added here by JS -->
          </div>
          <button
            type="button"
            id="add-relation-btn"
            class="mt-2 px-4 py-2 text-sm bg-accent/20 text-accent font-semibold rounded-lg hover:bg-accent/30"
          >
            + Aggiungi Relazione
          </button>
        </div>
      </div>

      <!-- TAB: AI -->
      <div id="character-tab-ai" class="hidden">
        <div
          class="rounded-lg border border-accent/20 p-4 bg-primary/40 space-y-3"
        >
          <p class="text-sm text-secondary">
            Usa l'IA per creare o migliorare il personaggio. Il risultato sarà
            in JSON: potrai rivederlo e applicarlo ai campi.
          </p>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-start">
            <div class="md:col-span-2">
              <label class="text-xs font-semibold text-secondary"
                >Istruzioni IA</label
              >
              <textarea
                id="ai-character-instructions"
                rows="6"
                class="w-full mt-1 p-3 bg-primary rounded-lg border border-accent/30"
                placeholder="Es. Crea un antagonista carismatico con motivazioni complesse..."
              ></textarea>
            </div>
            <div class="space-y-2">
              <label class="text-xs font-semibold text-secondary"
                >Parametri</label
              >
              <div class="flex items-center gap-2">
                <span class="text-xs text-secondary">Temp</span>
                <input
                  id="ai-character-temp"
                  type="range"
                  min="0"
                  max="1"
                  step="0.1"
                  value="0.7"
                  class="w-full"
                />
                <span id="ai-character-temp-val" class="text-xs w-6 text-right"
                  >0.7</span
                >
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs text-secondary">MaxTok</span>
                <input
                  id="ai-character-maxtok"
                  type="number"
                  min="200"
                  max="2000"
                  step="100"
                  value="700"
                  class="w-24 px-2 py-1 bg-primary border border-accent/30 rounded-lg"
                />
              </div>
              <label class="flex items-center gap-2 text-xs">
                <input
                  id="ai-character-use-context"
                  type="checkbox"
                  checked
                  class="accent-accent"
                />
                <span>Usa contesto romanzo (consigliato)</span>
              </label>
              <div
                id="ai-character-context-status"
                class="text-[11px] text-secondary"
              ></div>
              <div class="grid grid-cols-2 gap-2 pt-1">
                <div>
                  <label class="text-xs text-secondary">Genere</label>
                  <input
                    id="ai-character-genre"
                    type="text"
                    placeholder="es. comico, fantasy..."
                    class="w-full px-2 py-1 bg-primary border border-accent/30 rounded-lg"
                  />
                </div>
                <div>
                  <label class="text-xs text-secondary">Tono</label>
                  <input
                    id="ai-character-tone"
                    type="text"
                    placeholder="es. comico, grottesco..."
                    class="w-full px-2 py-1 bg-primary border border-accent/30 rounded-lg"
                  />
                </div>
              </div>
              <div class="flex gap-2 pt-1">
                <button
                  type="button"
                  id="ai-character-generate"
                  class="px-3 py-2 text-sm bg-accent text-primary font-bold rounded-lg hover:bg-accent-hover"
                >
                  Crea
                </button>
                <button
                  type="button"
                  id="ai-character-improve"
                  class="px-3 py-2 text-sm bg-accent/20 text-accent font-semibold rounded-lg hover:bg-accent/30"
                >
                  Migliora
                </button>
                <button
                  type="button"
                  id="ai-character-stop"
                  class="px-3 py-2 text-sm bg-red-500/20 text-red-500 font-semibold rounded-lg hover:bg-red-500/30"
                >
                  Stop
                </button>
              </div>
            </div>
          </div>
          <div class="space-y-2">
            <label class="text-xs font-semibold text-secondary"
              >Risultato (JSON)</label
            >
            <pre
              id="ai-character-output"
              class="w-full bg-primary rounded-lg border border-accent/30 p-3 overflow-auto"
              style="max-height: 220px"
            ></pre>
            <div class="flex gap-2">
              <button
                type="button"
                id="ai-character-apply"
                class="px-3 py-2 text-sm bg-accent/20 text-accent font-semibold rounded-lg hover:bg-accent/30"
              >
                Applica ai campi
              </button>
              <button
                type="button"
                id="ai-character-copy"
                class="px-3 py-2 text-sm bg-primary border border-accent/30 rounded-lg"
              >
                Copia
              </button>
            </div>
          </div>
        </div>
      </div>
    </form>
    <div
      class="flex justify-end gap-4 mt-6 pt-4 border-t border-accent/20 flex-shrink-0"
    >
      <button
        type="button"
        id="cancel-character-btn"
        class="px-6 py-2 bg-primary rounded-lg hover:bg-opacity-80"
      >
        Annulla
      </button>
      <button
        type="button"
        id="save-character-btn"
        class="px-6 py-2 bg-accent text-primary font-bold rounded-lg hover:bg-accent-hover"
      >
        Salva Personaggio
      </button>
    </div>
  </div>
</div>
