<div id="ai-assistant-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 hidden">
  <div class="w-[min(100%,900px)] max-h-[90vh] overflow-hidden bg-secondary border border-accent/30 rounded-2xl shadow-xl flex flex-col">
    <header class="p-4 border-b border-accent/20 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="bot" class="accent"></i>
        <h3 class="font-display text-xl">Assistente IA</h3>
      </div>
      <div class="flex items-center gap-2">
        <button id="ai-stop-btn" class="px-3 py-1 text-xs bg-primary border border-accent/30 rounded hover:bg-opacity-80">Stop</button>
        <button id="ai-close-btn" class="px-3 py-1 text-xs bg-red-500 text-white rounded hover:bg-red-600">Chiudi</button>
      </div>
    </header>
    <div class="grid grid-cols-1 md:grid-cols-[280px,1fr] min-h-[60vh] flex-1 overflow-hidden">
      <aside class="p-3 border-r border-accent/20 space-y-3 bg-primary/40 overflow-auto">
        <div>
          <h4 class="text-sm text-secondary mb-1">Modalità</h4>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <button class="ai-mode px-2 py-1 bg-primary border border-accent/30 rounded" data-mode="ideation">Ideazione</button>
            <button class="ai-mode px-2 py-1 bg-primary border border-accent/30 rounded" data-mode="structure">Struttura</button>
            <button class="ai-mode px-2 py-1 bg-primary border border-accent/30 rounded" data-mode="writing">Scrittura</button>
            <button class="ai-mode px-2 py-1 bg-primary border border-accent/30 rounded" data-mode="editing">Editing</button>
          </div>
        </div>
        <div>
          <h4 class="text-sm text-secondary mb-1">Preset</h4>
          <select id="ai-preset" class="w-full px-2 py-1 bg-primary border border-accent/30 rounded text-xs">
            <option value="coach">Coach creativo</option>
            <option value="worldbuilder">Worldbuilder</option>
            <option value="story-analyst">Analista di storia</option>
            <option value="scene-doctor">Scene Doctor</option>
          </select>
        </div>
        <div>
          <h4 class="text-sm text-secondary mb-1">Obiettivo</h4>
          <textarea id="ai-goal" rows="4" class="w-full px-2 py-1 bg-primary border border-accent/30 rounded text-xs" placeholder="Es. genera 10 logline originali sci-fi con twist..."></textarea>
        </div>
        <div>
          <h4 class="text-sm text-secondary mb-1">Contesto</h4>
          <div class="flex items-center justify-between mb-1">
            <span></span>
            <button id="ai-fill-context" class="px-2 py-1 text-xs bg-primary border border-accent/30 rounded hover:bg-opacity-80">Usa contesto progetto</button>
          </div>
          <textarea id="ai-context" rows="6" class="w-full px-2 py-1 bg-primary border border-accent/30 rounded text-xs" placeholder="Titolo progetto, tema, sinossi, personaggi, scena attuale, ecc."></textarea>
        </div>
      </aside>
  <section class="flex flex-col min-w-0 overflow-hidden">
        <div id="ai-output" class="flex-1 overflow-auto p-4 prose prose-invert max-w-none"></div>
        <div class="border-t border-accent/20 p-3 flex items-center gap-2">
          <input id="ai-prompt" class="flex-1 px-3 py-2 bg-primary border border-accent/30 rounded" placeholder="Chiedi all'IA...">
          <button id="ai-send-btn" class="px-3 py-2 bg-accent text-primary rounded hover:bg-accent-hover">Invia</button>
        </div>
      </section>
    </div>
  </div>
</div>
