<div id="new-idea-modal" class="modal-backdrop hidden">
    <div class="bg-secondary w-full max-w-lg rounded-2xl p-8 border border-accent/20">
        <h3 class="text-2xl font-display mb-4">Aggiungi una Nuova Idea</h3>
        <form id="new-idea-form">
            <textarea id="new-idea-content" name="content" placeholder="Scrivi la tua idea qui..." rows="5" required class="w-full mb-4 p-3 bg-primary rounded-lg border border-accent/30 focus:outline-none focus:ring-2 focus:ring-accent"></textarea>
            <div class="flex justify-end gap-4">
                <button type="button" id="cancel-idea-modal" class="px-6 py-2 bg-primary rounded-lg hover:bg-opacity-80">Annulla</button>
                <button type="submit" class="px-6 py-2 bg-accent text-primary font-bold rounded-lg hover:bg-accent-hover">Salva Idea</button>
            </div>
        </form>
    </div>
</div>
