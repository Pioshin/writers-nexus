<div id="config-modal" class="modal-backdrop hidden">
  <div class="bg-secondary w-full max-w-2xl rounded-2xl p-8 border border-accent/20 flex flex-col">
    <h3 class="text-2xl font-display mb-4">Configurazione AI</h3>
    <p class="text-secondary mb-6 text-sm">
      Configura il provider IA che desideri usare. I dati vengono salvati
      solo nel tuo browser (IndexedDB locale).
    </p>
    <form id="config-form" class="flex-grow overflow-y-auto pr-4 space-y-3">
      <section class="space-y-2">
        <h4 class="text-sm text-secondary">Assistente IA</h4>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-secondary mb-1">Provider</label>
            <select id="config-ai-provider" class="w-full px-3 py-2 bg-primary border border-accent/30 rounded">
              <option value="openai-compatible">OpenAI compatibile</option>
              <option value="google">Google (Gemini)</option>
              <option value="anthropic">Anthropic</option>
              <option value="ollama">Ollama (locale)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-secondary mb-1">Base URL (OpenAI-compatibile)</label>
            <input id="config-ai-baseurl" class="w-full px-3 py-2 bg-primary border border-accent/30 rounded"
              placeholder="https://api.openai.com/v1" />
          </div>
          <div id="generic-model-container">
            <div class="flex items-center justify-between mb-1">
              <label class="block text-xs text-secondary mb-1">Modello</label>
              <button type="button" id="test-connection-btn" class="text-xs text-accent hover:underline">Test
                Connessione</button>
            </div>
            <input id="config-ai-model" class="w-full px-3 py-2 bg-primary border border-accent/30 rounded"
              placeholder="gpt-4o-mini" list="config-model-suggestions" />
            <datalist id="config-model-suggestions"></datalist>
            <select id="config-ai-model-list"
              class="w-full mt-2 px-3 py-2 bg-primary border border-accent/30 rounded hidden"></select>
            <p id="generic-models-status" class="mt-1 text-xs text-secondary"></p>
          </div>
          <div id="google-model-container" class="hidden">
            <div class="flex items-center justify-between mb-1">
              <label class="block text-xs text-secondary">Modello (Gemini)</label>
              <button type="button" id="refresh-google-models" class="text-xs text-secondary hover:accent">
                Ricarica
              </button>
            </div>
            <select id="config-google-model" class="w-full px-3 py-2 bg-primary border border-accent/30 rounded">
              <option value="" disabled>Carica modelli...</option>
            </select>
            <p id="google-models-status" class="mt-1 text-xs text-secondary"></p>
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs text-secondary mb-1">API Key</label>
            <input id="config-ai-apikey" type="password"
              class="w-full px-3 py-2 bg-primary border border-accent/30 rounded" placeholder="sk-..." />
          </div>
        </div>
      </section>

      <!-- NOOS Hub Sync -->
      <section class="space-y-2 mt-4 pt-4 border-t border-accent/20">
        <h4 class="text-sm text-secondary">NOOS Hub (sync centralizzato)</h4>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div class="md:col-span-2 flex items-center gap-3">
            <input type="checkbox" id="config-hub-enabled"
              class="w-4 h-4 accent-accent cursor-pointer" />
            <label for="config-hub-enabled" class="text-xs text-secondary cursor-pointer">
              Abilita sync con NOOS Hub (dual-write)
            </label>
            <span id="hub-status-badge" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-primary text-secondary">
              disattivo
            </span>
          </div>
          <div>
            <label class="block text-xs text-secondary mb-1">Hub URL</label>
            <input id="config-hub-url" class="w-full px-3 py-2 bg-primary border border-accent/30 rounded"
              placeholder="http://127.0.0.1:9090" />
          </div>
          <div>
            <label class="block text-xs text-secondary mb-1">Hub Token (JWT)</label>
            <input id="config-hub-token" type="password"
              class="w-full px-3 py-2 bg-primary border border-accent/30 rounded"
              placeholder="eyJhbGci..." />
          </div>
          <div class="md:col-span-2">
            <button type="button" id="test-hub-btn"
              class="text-xs text-accent hover:underline">Test connessione Hub</button>
            <span id="hub-test-result" class="ml-2 text-xs text-secondary"></span>
          </div>
        </div>
      </section>
    </form>
    <div class="flex justify-end gap-4 mt-6 pt-4 border-t border-accent/20">
      <button type="button" id="cancel-config-modal" class="px-6 py-2 bg-primary rounded-lg hover:bg-opacity-80">
        Annulla
      </button>
      <button type="button" id="save-config-btn"
        class="px-6 py-2 bg-accent text-primary font-bold rounded-lg hover:bg-accent-hover">
        Salva Configurazione
      </button>
    </div>
  </div>
</div>
