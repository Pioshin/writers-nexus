<div id="geography-modal" class="modal-backdrop hidden">
    <div class="bg-secondary w-full max-w-2xl rounded-2xl p-8 border border-accent/20 flex flex-col">
        <h3 class="text-2xl font-display mb-4">Crea / Modifica Elemento Geografico</h3>
        <form id="geography-form" class="flex-grow overflow-y-auto pr-4 space-y-3">
            <input type="hidden" name="id" id="geography-id">
            <input id="geo-name" name="name" type="text" placeholder="Nome del luogo/elemento (es: Montagne di Cristallo)" required class="w-full mb-2 px-4 py-2 bg-primary border border-accent/30 rounded-lg">
            <textarea id="geo-description" name="description" placeholder="Descrizione dettagliata del luogo, ambiente, flora, fauna..." rows="6" class="w-full mb-2 p-3 bg-primary rounded-lg border border-accent/30"></textarea>
        </form>
        <div class="flex justify-end gap-4 mt-6 pt-4 border-t border-accent/20">
            <button type="button" id="cancel-geography-modal" class="px-6 py-2 bg-primary rounded-lg hover:bg-opacity-80">Annulla</button>
            <button type="button" id="save-geography-btn" class="px-6 py-2 bg-accent text-primary font-bold rounded-lg hover:bg-accent-hover">Salva Elemento</button>
        </div>
    </div>
</div>
