<div id="hero-suggestions-modal" class="modal-backdrop hidden">
  <div
    class="bg-primary border border-accent/40 rounded-lg shadow-xl w-[860px] max-h-[85vh] flex flex-col"
  >
    <div
      class="flex items-center justify-between px-5 py-3 border-b border-accent/30"
    >
      <h3 class="text-xl font-display flex items-center gap-2">
        <span class="text-accent">Suggerimenti Viaggio dell'Eroe</span
        ><span id="hero-sug-summary" class="text-xs text-secondary"></span>
      </h3>
      <div class="flex items-center gap-2">
        <button
          id="hero-sug-fetch"
          class="px-3 py-1 text-xs bg-accent text-primary rounded border border-accent/40 hover:bg-opacity-90"
        >
          Richiedi Suggerimenti
        </button>
        <button
          id="hero-sug-close"
          class="px-2 py-1 text-xs bg-secondary/70 rounded border border-accent/30 hover:bg-opacity-70"
        >
          ✕
        </button>
      </div>
    </div>
    <div class="p-4 overflow-y-auto flex-1 flex flex-col gap-4">
      <div class="flex flex-wrap gap-4 items-end">
        <div>
          <label
            class="block text-[11px] uppercase tracking-wide text-secondary mb-1"
            >Filtra min. confidenza</label
          >
          <input
            id="hero-sug-min-conf"
            type="number"
            step="0.05"
            min="0"
            max="1"
            value="0"
            class="w-24 text-xs bg-primary/70 border border-accent/30 rounded px-2 py-1"
          />
        </div>
        <div>
          <label
            class="block text-[11px] uppercase tracking-wide text-secondary mb-1"
            >Soglia auto-assegna</label
          >
          <input
            id="hero-sug-auto-threshold"
            type="number"
            step="0.05"
            min="0"
            max="1"
            value="0.75"
            class="w-24 text-xs bg-primary/70 border border-accent/30 rounded px-2 py-1"
          />
        </div>
        <div class="flex items-center gap-2 mt-4">
          <button
            id="hero-sug-apply-selected"
            disabled
            class="px-3 py-1 text-xs bg-primary/70 border border-accent/30 rounded hover:bg-primary disabled:opacity-40"
          >
            Applica Selezionati
          </button>
          <button
            id="hero-sug-auto-apply"
            disabled
            class="px-3 py-1 text-xs bg-primary/70 border border-accent/30 rounded hover:bg-primary disabled:opacity-40"
            title="Applica automaticamente tutti i suggerimenti >= soglia"
          >
            Auto-assegna >= soglia
          </button>
          <button
            id="hero-sug-clear"
            disabled
            class="px-3 py-1 text-xs bg-primary/70 border border-accent/30 rounded hover:bg-primary disabled:opacity-40"
          >
            Pulisci Lista
          </button>
        </div>
        <div class="ml-auto flex items-center gap-2 text-[11px] text-secondary">
          <span
            ><span class="inline-block w-3 h-3 rounded bg-[#047857]"></span>
            Atto I</span
          >
          <span
            ><span class="inline-block w-3 h-3 rounded bg-[#3730a3]"></span>
            Atto II</span
          >
          <span
            ><span class="inline-block w-3 h-3 rounded bg-[#9d174d]"></span>
            Atto III</span
          >
        </div>
      </div>
      <div id="hero-sug-count" class="text-[11px] text-secondary px-1"></div>
      <div
        id="hero-sug-table-wrapper"
        class="border border-accent/20 rounded overflow-hidden max-h-[50vh] overflow-y-auto"
      >
        <table class="w-full text-xs border-collapse" id="hero-sug-table">
          <thead class="bg-secondary/60">
            <tr>
              <th class="p-2 text-left w-6">
                <input
                  type="checkbox"
                  id="hero-sug-select-all"
                  class="accent-accent"
                />
              </th>
              <th class="p-2 text-left">Scena</th>
              <th class="p-2 text-left">Suggerito</th>
              <th class="p-2 text-left">Conf.</th>
              <th class="p-2 text-left">Stadio Corrente</th>
              <th class="p-2 text-left">Anteprima</th>
            </tr>
          </thead>
          <tbody
            id="hero-sug-tbody"
            class="divide-y divide-accent/10 bg-primary/40"
          ></tbody>
        </table>
      </div>
      <div
        id="hero-sug-log"
        class="text-[11px] font-mono text-secondary whitespace-pre-wrap"
      ></div>
    </div>
  </div>
</div>
