<div id="plotline-modal" class="modal-backdrop hidden">
  <div
    class="bg-secondary w-full max-w-4xl rounded-2xl p-6 border border-accent/20 flex flex-col"
    style="max-height: 85vh; overflow-y: auto"
  >
    <h3 class="text-2xl font-display mb-4">Gestisci Linee Narrative</h3>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 flex-1">
      <div class="md:col-span-1 flex flex-col">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm text-secondary">Linee esistenti</span>
          <button
            id="pl-new-btn"
            class="text-xs px-2 py-1 bg-primary rounded border border-accent/30"
          >
            Nuova
          </button>
        </div>
        <div
          id="pl-list"
          class="flex-1 overflow-auto bg-primary rounded border border-accent/20"
        ></div>
      </div>
      <div class="md:col-span-2 flex flex-col overflow-hidden">
        <form id="pl-form" class="space-y-3 pr-2">
          <input type="hidden" id="pl-id" />
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold text-secondary">Titolo</label>
              <input
                id="pl-name"
                type="text"
                class="w-full mt-1 px-3 py-2 bg-primary border border-accent/30 rounded"
                placeholder="Es: Indagine sull'omicidio"
              />
            </div>
            <div>
              <label class="text-xs font-semibold text-secondary">Tipo</label>
              <select
                id="pl-type"
                class="w-full mt-1 px-3 py-2 bg-primary border border-accent/30 rounded"
              >
                <option value="main">Principale</option>
                <option value="subplot">Sottotrama</option>
                <option value="arc">Arco personaggio</option>
                <option value="mystery">Mistero</option>
                <option value="romance">Romance</option>
                <option value="world">Mondo/Politica</option>
                <option value="other">Altro</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-semibold text-secondary">Colore</label>
              <input
                id="pl-color"
                type="color"
                class="w-16 h-9 mt-1 p-0 bg-primary border border-accent/30 rounded"
              />
            </div>
            <div>
              <label class="text-xs font-semibold text-secondary">Stato</label>
              <select
                id="pl-status"
                class="w-full mt-1 px-3 py-2 bg-primary border border-accent/30 rounded"
              >
                <option value="active">Attiva</option>
                <option value="paused">Pausa</option>
                <option value="closed">Chiusa</option>
              </select>
            </div>
          </div>
          <div>
            <label class="text-xs font-semibold text-secondary"
              >Logline / Obiettivo</label
            >
            <input
              id="pl-logline"
              type="text"
              class="w-full mt-1 px-3 py-2 bg-primary border border-accent/30 rounded"
              placeholder="In una frase, cosa persegue questa linea"
            />
          </div>
          <div>
            <label class="text-xs font-semibold text-secondary"
              >Descrizione</label
            >
            <textarea
              id="pl-description"
              rows="3"
              class="w-full mt-1 p-3 bg-primary border border-accent/30 rounded"
              placeholder="Dettagli e posta in gioco..."
            ></textarea>
          </div>

          <div class="mt-2">
            <div class="flex items-center justify-between mb-2">
              <h4 class="text-lg font-display">Beats</h4>
              <button
                id="pl-add-beat"
                type="button"
                class="text-xs px-2 py-1 bg-primary rounded border border-accent/30"
              >
                Aggiungi beat
              </button>
            </div>
            <div id="pl-beats" class="space-y-2"></div>
          </div>
        </form>
      </div>
    </div>
    <div
      class="flex justify-between gap-4 mt-4 pt-3 border-t border-accent/20 sticky bottom-0 bg-secondary"
    >
      <button
        type="button"
        id="pl-delete-btn"
        class="px-4 py-2 bg-red-500/20 text-red-300 rounded border border-red-500/40"
      >
        Elimina
      </button>
      <div class="flex gap-3">
        <button
          type="button"
          id="pl-cancel-btn"
          class="px-5 py-2 bg-primary rounded"
        >
          Chiudi
        </button>
        <button
          type="button"
          id="pl-save-btn"
          class="px-5 py-2 bg-accent text-primary font-semibold rounded"
        >
          Salva
        </button>
      </div>
    </div>
  </div>
</div>
