<div id="history-modal" class="modal-backdrop hidden">
  <div
    class="bg-secondary w-full max-w-2xl rounded-2xl p-8 border border-accent/20 flex flex-col"
  >
    <h3 class="text-2xl font-display mb-4">Crea / Modifica Elemento Storico</h3>
    <div class="flex gap-2 mb-3">
      <button
        type="button"
        id="hist-tab-details"
        class="px-3 py-1 rounded-lg bg-accent/20 text-accent font-semibold"
      >
        Dettagli
      </button>
      <button
        type="button"
        id="hist-tab-ai"
        class="px-3 py-1 rounded-lg hover:bg-primary"
      >
        IA
      </button>
    </div>
    <form id="history-form" class="flex-grow overflow-y-auto pr-4 space-y-3">
      <div id="hist-tab-details-pane" class="space-y-3">
        <input type="hidden" name="id" id="history-id" />
        <input
          id="hist-title"
          name="title"
          type="text"
          placeholder="Titolo (es: La Grande Caduta)"
          required
          class="w-full mb-2 px-4 py-2 bg-primary border border-accent/30 rounded-lg"
        />
        <textarea
          id="hist-narration"
          name="narration"
          placeholder="Narrazione, miti, leggende, eventi chiave..."
          rows="6"
          class="w-full mb-2 p-3 bg-primary rounded-lg border border-accent/30"
        ></textarea>
      </div>
      <div id="hist-tab-ai-pane" class="hidden space-y-3">
        <div
          class="rounded-lg border border-accent/20 p-4 bg-primary/40 space-y-3"
        >
          <p class="text-sm text-secondary">
            Usa l'IA per creare o migliorare l'elemento storico. Risposta in
            JSON.
          </p>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3 items-start">
            <div class="md:col-span-2">
              <label class="text-xs font-semibold text-secondary"
                >Istruzioni IA</label
              >
              <textarea
                id="ai-hist-instructions"
                rows="5"
                class="w-full mt-1 p-3 bg-primary rounded-lg border border-accent/30"
                placeholder="Es. Riassumi la leggenda in modo coerente con il tono..."
              ></textarea>
            </div>
            <div class="space-y-2">
              <label class="text-xs font-semibold text-secondary"
                >Parametri</label
              >
              <div class="flex items-center gap-2">
                <span class="text-xs text-secondary">Temp</span>
                <input
                  id="ai-hist-temp"
                  type="range"
                  min="0"
                  max="1"
                  step="0.1"
                  value="0.7"
                  class="w-full"
                />
                <span id="ai-hist-temp-val" class="text-xs w-6 text-right"
                  >0.7</span
                >
              </div>
              <div class="flex items-center gap-2">
                <span class="text-xs text-secondary">MaxTok</span>
                <input
                  id="ai-hist-maxtok"
                  type="number"
                  min="200"
                  max="2000"
                  step="100"
                  value="600"
                  class="w-24 px-2 py-1 bg-primary border border-accent/30 rounded-lg"
                />
              </div>
              <label class="flex items-center gap-2 text-xs">
                <input
                  id="ai-hist-use-context"
                  type="checkbox"
                  checked
                  class="accent-accent"
                />
                <span>Usa contesto romanzo</span>
              </label>
              <div
                id="ai-hist-context-status"
                class="text-[11px] text-secondary"
              ></div>
              <div class="grid grid-cols-2 gap-2 pt-1">
                <div>
                  <label class="text-xs text-secondary">Genere</label>
                  <input
                    id="ai-hist-genre"
                    type="text"
                    class="w-full px-2 py-1 bg-primary border border-accent/30 rounded-lg"
                  />
                </div>
                <div>
                  <label class="text-xs text-secondary">Tono</label>
                  <input
                    id="ai-hist-tone"
                    type="text"
                    class="w-full px-2 py-1 bg-primary border border-accent/30 rounded-lg"
                  />
                </div>
              </div>
              <div class="flex gap-2 pt-1">
                <button
                  type="button"
                  id="ai-hist-generate"
                  class="px-3 py-2 text-sm bg-accent text-primary font-bold rounded-lg hover:bg-accent-hover"
                >
                  Crea
                </button>
                <button
                  type="button"
                  id="ai-hist-improve"
                  class="px-3 py-2 text-sm bg-accent/20 text-accent font-semibold rounded-lg hover:bg-accent/30"
                >
                  Migliora
                </button>
                <button
                  type="button"
                  id="ai-hist-stop"
                  class="px-3 py-2 text-sm bg-red-500/20 text-red-500 font-semibold rounded-lg hover:bg-red-500/30"
                >
                  Stop
                </button>
              </div>
            </div>
          </div>
          <div class="space-y-2">
            <label class="text-xs font-semibold text-secondary"
              >Risultato (JSON)</label
            >
            <pre
              id="ai-hist-output"
              class="w-full bg-primary rounded-lg border border-accent/30 p-3 overflow-auto"
              style="max-height: 220px"
            ></pre>
            <div class="flex gap-2">
              <button
                type="button"
                id="ai-hist-apply"
                class="px-3 py-2 text-sm bg-accent/20 text-accent font-semibold rounded-lg hover:bg-accent/30"
              >
                Applica ai campi
              </button>
              <button
                type="button"
                id="ai-hist-copy"
                class="px-3 py-2 text-sm bg-primary border border-accent/30 rounded-lg"
              >
                Copia
              </button>
            </div>
          </div>
        </div>
      </div>
    </form>
    <div class="flex justify-end gap-4 mt-6 pt-4 border-t border-accent/20">
      <button
        type="button"
        id="cancel-history-modal"
        class="px-6 py-2 bg-primary rounded-lg hover:bg-opacity-80"
      >
        Annulla
      </button>
      <button
        type="button"
        id="save-history-btn"
        class="px-6 py-2 bg-accent text-primary font-bold rounded-lg hover:bg-accent-hover"
      >
        Salva Elemento
      </button>
    </div>
  </div>
</div>
