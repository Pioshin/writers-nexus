<div id="view-dashboard" class="view-content">
  <div class="border-b border-accent/20 mb-6 pb-4">
    <div class="flex justify-between items-center">
      <h2 class="text-4xl font-display">I Tuoi Progetti</h2>
      <button
        id="new-project-btn"
        class="flex items-center px-4 py-2 bg-accent text-primary font-bold rounded-lg hover:bg-accent-hover transition"
      >
        <i data-lucide="plus-circle" class="mr-2"></i>Nuovo Progetto
      </button>
    </div>
  </div>
  <div
    id="projects-list"
    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
  ></div>
</div>

<!-- Modale per Conferma Eliminazione Progetto -->
<div id="delete-project-confirm-modal" class="modal-backdrop hidden">
  <div
    class="bg-secondary w-full max-w-md rounded-2xl p-8 border border-accent/20"
  >
    <div class="text-center">
      <div
        class="w-16 h-16 mx-auto mb-4 bg-red-500/20 rounded-full flex items-center justify-center"
      >
        <i data-lucide="alert-triangle" class="w-8 h-8 text-red-400"></i>
      </div>
      <h3 class="text-2xl font-display mb-4 text-red-400">Elimina Progetto</h3>
      <p class="text-secondary mb-2">Sei sicuro di voler eliminare</p>
      <p class="text-primary font-semibold mb-4">
        "<span id="delete-project-name">Nome Progetto</span>"?
      </p>
      <p class="text-sm text-secondary mb-6">
        ⚠️ Questa azione non può essere annullata. Tutti i dati del progetto
        saranno persi definitivamente.
      </p>
      <div class="flex justify-center gap-4">
        <button
          type="button"
          id="cancel-delete-project-modal"
          class="px-6 py-2 bg-primary rounded-lg hover:bg-opacity-80"
        >
          Annulla
        </button>
        <button
          type="button"
          id="confirm-delete-project"
          class="px-6 py-2 bg-red-500 text-white font-bold rounded-lg hover:bg-red-600"
        >
          🗑️ Elimina Definitivamente
        </button>
      </div>
    </div>
  </div>
</div>
