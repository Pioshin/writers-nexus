<div id="view-writing" class="view-content p-6 h-full flex flex-col">
    <div class="border-b border-accent/20 mb-4 pb-4">
        <div class="flex justify-between items-center">
            <div>
                <button id="back-to-structure-btn" class="flex items-center text-sm text-secondary hover:text-accent mb-2">
                    <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i>
                    Torna alla Struttura
                </button>
                <div class="flex items-start gap-3 flex-wrap">
                    <h2 id="writing-scene-title" class="text-3xl md:text-4xl font-display">Scrittura Scena</h2>
                    <div id="writing-stage-badge" class="mt-1 hidden flex items-center gap-2 bg-primary/60 border border-accent/30 rounded px-2 py-1 text-xs">
                        <span id="writing-stage-label" class="font-semibold"></span>
                        <button id="writing-stage-edit" class="text-[10px] px-1 py-0.5 rounded bg-secondary/70 hover:bg-secondary border border-accent/30">Cambia</button>
                    </div>
                </div>
            </div>
            <div class="flex items-end gap-6">
                <div class="text-right">
                    <p class="text-secondary">Conteggio parole</p>
                    <p id="word-count" class="text-2xl font-bold">0</p>
                </div>
                <div class="flex gap-2">
                    <button id="open-ai-writing" class="px-3 py-2 text-sm bg-secondary rounded-lg border border-accent/30 hover:bg-primary flex items-center"><i data-lucide="bot" class="w-4 h-4 mr-1"></i>IA</button>
                    <button id="prev-scene-btn" class="px-3 py-2 text-sm bg-primary rounded-lg border border-accent/30 hover:bg-opacity-80"><i data-lucide="chevron-left" class="w-4 h-4 mr-1"></i>Precedente</button>
                    <button id="next-scene-btn" class="px-3 py-2 text-sm bg-primary rounded-lg border border-accent/30 hover:bg-opacity-80">Successiva<i data-lucide="chevron-right" class="w-4 h-4 ml-1"></i></button>
                <button id="open-manuscript-btn" class="px-3 py-2 text-sm bg-accent text-primary rounded-lg hover:bg-accent-hover"><i data-lucide="book-open" class="w-4 h-4 mr-1"></i>Manoscritto</button>
                </div>
            </div>
        </div>
    </div>

    <div class="flex-1 flex min-h-0 gap-4">
        <!-- Navigator Scene (ordine Struttura) -->
    <aside class="w-72 hidden lg:block bg-secondary border border-accent/10 rounded-lg p-3 overflow-y-auto">
            <h3 class="text-sm font-semibold text-secondary mb-2">Scene (ordine Struttura)</h3>
            <ul id="scenes-nav" class="space-y-1 text-sm"></ul>
        </aside>

        <!-- Editor a blocchi -->
        <section class="flex-1 flex flex-col min-w-0">
            <div id="scene-meta" class="text-secondary text-sm mb-3"></div>
            <div id="scene-stage-inline-edit" class="hidden mb-3 bg-secondary border border-accent/20 p-3 rounded flex flex-wrap gap-2 items-center">
                <label class="text-xs font-semibold">Stadio viaggio eroe:</label>
                <select id="scene-stage-select-writing" class="text-xs bg-primary border border-accent/30 rounded px-2 py-1">
                    <option value="unassigned">(Non assegnata)</option>
                    <option value="ordinary_world">Mondo Ordinario</option>
                    <option value="call_to_adventure">Chiamata</option>
                    <option value="refusal_of_call">Rifiuto</option>
                    <option value="meeting_mentor">Mentore</option>
                    <option value="crossing_threshold">Soglia</option>
                    <option value="tests_allies_enemies">Prove/Alleati/Nemici</option>
                    <option value="inmost_cave">Avvicinamento</option>
                    <option value="ordeal">Prova Centrale</option>
                    <option value="reward">Ricompensa</option>
                    <option value="road_back">Via del Ritorno</option>
                    <option value="resurrection">Resurrezione</option>
                    <option value="return_with_elixir">Ritorno</option>
                </select>
                <button id="scene-stage-save" class="text-xs px-2 py-1 bg-accent text-primary rounded border border-accent/30 hover:bg-accent-hover">Salva</button>
                <button id="scene-stage-cancel" class="text-xs px-2 py-1 bg-primary rounded border border-accent/30 hover:bg-opacity-80">Annulla</button>
                <div id="scene-stage-feedback" class="text-[10px] text-secondary"></div>
            </div>
            <div id="blocks-container" class="flex-1 overflow-y-auto space-y-3 p-2 bg-secondary border border-accent/10 rounded-lg"></div>
            <div class="flex justify-between items-center mt-3">
                <button id="add-block-btn" class="flex items-center px-3 py-2 bg-accent text-primary font-bold rounded-lg hover:bg-accent-hover transition"><i data-lucide="plus" class="w-4 h-4 mr-2"></i>Aggiungi Paragrafo</button>
                <div class="text-xs text-secondary">Salvataggio automatico dopo una breve pausa di digitazione</div>
            </div>
        </section>
    </div>
  
        <!-- Overlay Manoscritto full-screen senza distrazioni -->
            <div id="manuscript-overlay" class="hidden fixed inset-0 z-50 bg-primary">
                <div class="max-w-5xl mx-auto h-full flex flex-col p-4">
                    <header class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between pb-3 border-b border-accent/20 bg-secondary rounded px-2 py-1">
                        <div class="flex items-center gap-2 text-secondary">
                            <i data-lucide="book-open" class="w-5 h-5"></i>
                            <span class="text-sm">Vista Manoscritto</span>
                        </div>
                        <nav id="manuscript-anchors" class="flex flex-wrap gap-2 text-xs"></nav>
                        <div class="flex items-center gap-2">
                            <div class="hidden sm:flex items-center gap-4 mr-3 text-secondary text-xs">
                                <div>Parole: <span id="manuscript-words" class="text-primary font-bold">0</span></div>
                                <div>Pagine: <span id="manuscript-pages" class="text-primary font-bold">0.00</span></div>
                            </div>
                            <button id="toggle-focus-mode" class="px-3 py-1 text-xs bg-primary rounded-lg border border-accent/30 hover:bg-opacity-80">Focus paragrafo</button>
                            <button id="toggle-manuscript-edit" class="px-3 py-1 text-xs bg-primary rounded-lg border border-accent/30 hover:bg-opacity-80">Solo lettura</button>
                            <button id="close-manuscript-btn" class="px-3 py-1 text-sm bg-red-500 text-white rounded-lg hover:bg-red-600"><i data-lucide="x" class="w-4 h-4 mr-1"></i>Chiudi</button>
                        </div>
                    </header>
                    <main id="manuscript-content" class="flex-1 overflow-y-auto py-6 bg-secondary rounded px-3"></main>
                <footer class="pt-3 border-t border-accent/20 text-center text-xs text-secondary">ESC per chiudere • Salvataggio automatico attivo</footer>
            </div>
        </div>
</div>
